name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Unit tests
        run: node --test tests/*.test.mjs

      - name: Check the release file list
        run: node tools/build-release.mjs --dry-run
