# Publishing a GitHub release tagged v<version> (for example v1.0.3) builds the module and attaches
# module.json and module.zip to that release. Foundry installs from:
#   manifest: https://github.com/<owner>/<repo>/releases/latest/download/module.json
#   download: https://github.com/<owner>/<repo>/releases/download/v<version>/module.zip
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Unit tests
        run: node --test tests/*.test.mjs

      # Fails if the tag is not v + module.json's version; sets "download" to this tag's zip.
      - name: Build module.zip and module.json
        run: node tools/build-release.mjs --tag "$TAG"

      - name: List the zip
        run: unzip -l dist/module.zip

      - name: Attach to the release
        run: gh release upload "$TAG" dist/module.json dist/module.zip --clobber --repo "$GITHUB_REPOSITORY"
